# Local stack: PostgreSQL with pgvector, the FastAPI API and the React app served by nginx.
# docker compose up --build   then open http://localhost:8080
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      AEGIS_DATABASE_URL: postgresql+psycopg://aegis:aegis@db:5432/aegis
      AEGIS_EMBEDDING_PROVIDER: hash # set to bedrock and pass AWS credentials to use Titan embeddings
      AEGIS_SEED_DEMO_DATA: "true"
      AEGIS_CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  pgdata:
